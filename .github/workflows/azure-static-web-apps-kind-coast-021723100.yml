name: Deploy frontend (Azure Static Web Apps)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/azure-static-web-apps-kind-coast-021723100.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The Static Web App authorizes deploys with GitHub OIDC, so the deploy
      # action needs an ID token. github-script ships @actions/core as `core`,
      # so nothing is npm-installed (a root package-lock.json once broke builds).
      - name: Get Id Token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: return await core.getIDToken()
          result-encoding: string

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        # NEXT_PUBLIC_* values are compiled into the JS at build time, so they
        # must be set here (and also in the SWA resource's Environment
        # variables for server-side rendering at request time).
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://zvepctjxrvdtoyatpzqh.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ vars.BACKEND_URL || 'https://nutrimess-backend-fbb3fwemg4evckah.eastasia-01.azurewebsites.net' }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_COAST_021723100 }}
          action: "upload"
          # Hybrid (SSR) Next.js app in frontend/; output_location stays empty
          # so SWA serves it as a Next.js app rather than static files.
          # package.json "engines" pins Node 22 (Next 16 needs >= 20.9).
          app_location: "frontend"
          api_location: ""
          output_location: ""
          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_COAST_021723100 }}
          action: "close"
