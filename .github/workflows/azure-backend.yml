name: Deploy backend (Azure App Service)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/azure-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://nutrimess-backend-fbb3fwemg4evckah.eastasia-01.azurewebsites.net/api/health
    steps:
      - uses: actions/checkout@v4

      # Ship only what the server needs; App Service (Oryx) installs
      # requirements.txt during deployment (SCM_DO_BUILD_DURING_DEPLOYMENT=true).
      - name: Package app
        run: |
          mkdir -p dist
          cp -r backend/app backend/requirements.txt dist/
          find dist -name "__pycache__" -type d -prune -exec rm -rf {} +

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: NutriMess-backend
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          package: dist

      - name: Health check
        run: |
          url="https://nutrimess-backend-fbb3fwemg4evckah.eastasia-01.azurewebsites.net/api/health"
          for i in $(seq 1 20); do
            if curl -fsS --max-time 30 "$url"; then echo; echo "Backend healthy"; exit 0; fi
            echo "Waiting for backend to start ($i/20)..."; sleep 15
          done
          echo "Backend did not become healthy; check App Service > Log stream"; exit 1
