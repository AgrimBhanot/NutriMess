# Render Blueprint: New + > Blueprint > pick this repo.
# Secrets marked sync: false are entered in the Render dashboard.
services:
  - type: web
    name: nutrimess-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        value: https://zvepctjxrvdtoyatpzqh.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        value: https://nutrimess.vercel.app,http://localhost:3000
      - key: CORS_ORIGIN_REGEX
        value: https://nutrimess-.*\.vercel\.app
      - key: DEBUG
        value: "false"
